<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occhio! — provalo</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap">
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: #141414; color: #F6F3EC; font: 400 20px/1.4 Inter, Arial, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6vw; padding: 24px 16px; flex-wrap: wrap; }
img { width: min(78vh, 86vw); height: auto; border-radius: 18px; display: block; }
.txt { max-width: 520px; }
.tag { display: inline-block; background: #FF9800; color: #141414; font: 400 34px/1 Anton, Impact, sans-serif; letter-spacing: 3px; text-transform: uppercase; padding: 11px 18px 9px; }
h1 { font: 400 clamp(40px, 6vw, 84px)/1.05 Anton, Impact, sans-serif; text-transform: uppercase; letter-spacing: 1px; margin: 22px 0 14px; }
p { margin: 0 0 10px; color: #D8D3C6; }
.url { color: #FFB74D; font-weight: 600; word-break: break-all; }
</style>
</head>
<body>
<img src="qr.png" alt="QR code che apre lsinigaglia.github.io/occhio">
<div class="txt">
<span class="tag">Occhio!</span>
<h1>Provalo sul tuo telefono</h1>
<p>Inquadra il codice con la fotocamera. Si apre nel browser, senza installare niente.</p>
<p class="url">lsinigaglia.github.io/occhio</p>
</div>
</body>
</html>
